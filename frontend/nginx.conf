server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed assets are immutable; index.html must never be cached or a deploy
  # would keep serving the previous bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Same-origin API. Serving both from one host means no CORS allowlist and no
  # cross-site cookie problem — the session cookie is first-party here.
  #
  # proxy_pass through a variable (rather than a literal) defers DNS to request
  # time, so nginx still starts when no `api` service exists — the case when
  # this image is deployed standalone and VITE_API_URL points at another host.
  location /api/ {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # trust proxy is enabled in the API, so this decides whether the session
    # cookie gets its Secure attribute honoured.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Client-side routing: unknown paths render the SPA, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
